# Local stack. Copy .env.example to .env first; Compose reads .env automatically.
# Fixed project name, so container, network and volume names don't depend on the folder name.
name: offline-truck-entry

services:
  db:
    image: postgres:16-alpine
    environment:
      # ":?" makes Compose stop with this message instead of starting without a value.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1 only: the backend and tests on this machine can connect, other devices can't.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: the data survives `docker compose down` and container re-creation.
      - db-data:/var/lib/postgresql/data
      # Postgres runs the .sql files here once, when it creates an empty data volume.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check (-h localhost): on first start Postgres runs a socket-only setup server,
      # so a socket check could say "ready" before setup has finished.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      # Inside Docker's network the database is the service "db" on its own port 5432.
      # (POSTGRES_PORT in .env is the port on this machine, so it is not used here.)
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_KEY: ${API_KEY:?set API_KEY in .env}
      UPLOAD_DIR: /app/uploads
    ports:
      # Localhost by default. Set API_BIND=0.0.0.0 in .env to reach it from a phone on the same Wi-Fi.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    volumes:
      # Truck photos live in a named volume, so they survive container re-creation.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy # start only once Postgres accepts connections
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db-data:
  uploads:
